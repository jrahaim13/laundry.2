<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dinner Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1c241c;
      --paper: #f7f2e8;
      --sage: #3d5a45;
      --leaf: #6b8f71;
      --ember: #c45c26;
      --mist: rgba(28, 36, 28, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Source Sans 3", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 60% at 10% 20%, rgba(107, 143, 113, 0.22), transparent 55%),
        radial-gradient(ellipse 70% 50% at 90% 80%, rgba(196, 92, 38, 0.14), transparent 50%),
        linear-gradient(165deg, #efe6d4 0%, var(--paper) 45%, #e4efe6 100%);
    }

    .hero {
      min-height: 100vh;
      display: grid;
      place-content: center;
      padding: clamp(1.5rem, 4vw, 3rem);
      text-align: center;
      animation: rise 0.9s ease-out both;
    }

    .brand {
      font-family: "Fraunces", serif;
      font-size: clamp(3rem, 10vw, 5.5rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--sage);
      line-height: 0.95;
      margin-bottom: 1rem;
    }

    .headline {
      font-family: "Fraunces", serif;
      font-size: clamp(1.25rem, 3vw, 1.75rem);
      font-weight: 500;
      color: var(--ink);
      margin-bottom: 0.75rem;
    }

    .lede {
      max-width: 28rem;
      margin: 0 auto 1.75rem;
      font-size: 1.1rem;
      line-height: 1.5;
      color: rgba(28, 36, 28, 0.78);
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.85rem 1.5rem;
      border: none;
      border-radius: 0.35rem;
      background: var(--ember);
      color: #fffaf3;
      font: inherit;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .cta:hover {
      background: #a84a1c;
      transform: translateY(-2px);
    }

    .cta:focus-visible {
      outline: 3px solid var(--leaf);
      outline-offset: 3px;
    }

    .plan {
      max-width: 40rem;
      margin: 0 auto;
      padding: 0 clamp(1.5rem, 4vw, 3rem) 4rem;
      animation: rise 1.1s 0.15s ease-out both;
    }

    .plan h2 {
      font-family: "Fraunces", serif;
      font-size: 1.75rem;
      color: var(--sage);
      margin-bottom: 0.5rem;
    }

    .plan > p {
      margin-bottom: 1.5rem;
      color: rgba(28, 36, 28, 0.75);
    }

    form {
      display: grid;
      gap: 1rem;
    }

    label {
      display: grid;
      gap: 0.35rem;
      font-weight: 600;
      font-size: 0.95rem;
      text-align: left;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 0.75rem 0.9rem;
      border: 1px solid var(--mist);
      border-radius: 0.35rem;
      background: rgba(255, 250, 243, 0.85);
      font: inherit;
      color: var(--ink);
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: 2px solid var(--leaf);
      outline-offset: 1px;
    }

    textarea {
      min-height: 6rem;
      resize: vertical;
    }

    .nights {
      display: grid;
      gap: 0.75rem;
      margin-top: 0.25rem;
    }

    .night {
      display: grid;
      grid-template-columns: 6rem 1fr;
      gap: 0.75rem;
      align-items: center;
      padding: 0.65rem 0;
      border-bottom: 1px solid var(--mist);
      animation: fade-in 0.6s ease both;
    }

    .night:nth-child(1) { animation-delay: 0.2s; }
    .night:nth-child(2) { animation-delay: 0.3s; }
    .night:nth-child(3) { animation-delay: 0.4s; }
    .night:nth-child(4) { animation-delay: 0.5s; }
    .night:nth-child(5) { animation-delay: 0.6s; }
    .night:nth-child(6) { animation-delay: 0.7s; }
    .night:nth-child(7) { animation-delay: 0.8s; }

    .night span {
      font-family: "Fraunces", serif;
      color: var(--sage);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 0.5rem;
    }

    .ghost {
      background: transparent;
      color: var(--sage);
      border: 1.5px solid var(--sage);
    }

    .ghost:hover {
      background: rgba(61, 90, 69, 0.08);
      transform: translateY(-2px);
    }

    .status {
      min-height: 1.5rem;
      margin-top: 1rem;
      color: var(--sage);
      font-weight: 600;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateX(-8px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @media (max-width: 560px) {
      .night {
        grid-template-columns: 1fr;
        gap: 0.35rem;
      }
    }
  </style>
</head>
<body>
  <header class="hero">
    <p class="brand">Dinner Plan</p>
    <h1 class="headline">One week of meals, sorted.</h1>
    <p class="lede">Sketch tonight through next Sunday—no laundry lists, just what you&rsquo;re cooking.</p>
    <a class="cta" href="#week">Plan this week</a>
  </header>

  <main class="plan" id="week">
    <h2>This week&rsquo;s table</h2>
    <p>Fill in each night. Save keeps your plan in this browser.</p>
    <form id="dinner-form">
      <label>
        Week of
        <input type="date" name="weekOf" id="weekOf" required />
      </label>
      <div class="nights" id="nights" aria-label="Meals by night"></div>
      <label>
        Notes
        <textarea name="notes" id="notes" placeholder="Grocery runs, leftovers, guests…"></textarea>
      </label>
      <div class="actions">
        <button type="submit" class="cta">Save plan</button>
        <button type="button" class="cta ghost" id="clear">Clear</button>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script>
    const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
    const STORAGE_KEY = "dinner-plan.v1";
    const nightsEl = document.getElementById("nights");
    const form = document.getElementById("dinner-form");
    const statusEl = document.getElementById("status");
    const weekOf = document.getElementById("weekOf");
    const notes = document.getElementById("notes");

    DAYS.forEach((day) => {
      const row = document.createElement("div");
      row.className = "night";
      row.innerHTML = `<span>${day}</span><input type="text" name="${day}" placeholder="What's for dinner?" autocomplete="off" />`;
      nightsEl.appendChild(row);
    });

    function mondayOf(d = new Date()) {
      const date = new Date(d);
      const day = (date.getDay() + 6) % 7;
      date.setDate(date.getDate() - day);
      return date.toISOString().slice(0, 10);
    }

    function load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          weekOf.value = mondayOf();
          return;
        }
        const data = JSON.parse(raw);
        weekOf.value = data.weekOf || mondayOf();
        notes.value = data.notes || "";
        DAYS.forEach((day) => {
          const input = form.elements.namedItem(day);
          if (input) input.value = data.meals?.[day] || "";
        });
      } catch {
        weekOf.value = mondayOf();
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const meals = {};
      DAYS.forEach((day) => {
        meals[day] = form.elements.namedItem(day).value.trim();
      });
      const payload = { weekOf: weekOf.value, notes: notes.value.trim(), meals };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      statusEl.textContent = "Plan saved for this browser.";
    });

    document.getElementById("clear").addEventListener("click", () => {
      DAYS.forEach((day) => {
        form.elements.namedItem(day).value = "";
      });
      notes.value = "";
      weekOf.value = mondayOf();
      localStorage.removeItem(STORAGE_KEY);
      statusEl.textContent = "Cleared.";
    });

    load();
  </script>
</body>
</html>
